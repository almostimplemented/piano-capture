[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piano-capture"
version = "0.1.0"
description = "Automated capture of aligned audio-MIDI recordings with a self-playing piano (e.g. Yamaha Disklavier)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Drew Edwards", email = "a.c.edwards@qmul.ac.uk" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["disklavier", "midi", "audio", "piano", "transcription", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fire>=0.5",
    "mido>=1.3",
    "numpy",
    "python-rtmidi>=1.5",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "tqdm>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
piano-capture = "piano_capture.app:main"
piano-capture-postprocess = "piano_capture.postprocess:main"
piano-capture-devices = "piano_capture.util:list_devices"

[project.urls]
Repository = "https://github.com/almostimplemented/piano-capture"
Issues = "https://github.com/almostimplemented/piano-capture/issues"
Dataset = "https://zenodo.org/records/10082144"
Paper = "https://arxiv.org/abs/2402.01424"

[tool.hatch.build.targets.wheel]
packages = ["piano_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
